<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;

      background: #000;

</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_18 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_18" style="display:block;"><svg height="100%" style="background: transparent; overflow: visible;" viewbox="0 0 540 380" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialgradient cx="50%" cy="40%" id="uncommonNebula" r="60%">
<stop offset="0%" stop-color="#74DDF4" stop-opacity="0.22"></stop>
<stop offset="50%" stop-color="#17133B" stop-opacity="0.12"></stop>
<stop offset="100%" stop-color="#080B24" stop-opacity="0"></stop>
</radialgradient>
<lineargradient id="uncommonTrail" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#60a5fa" stop-opacity="0"></stop>
<stop offset="45%" stop-color="#74DDF4" stop-opacity="0.6"></stop>
<stop offset="85%" stop-color="#B6A4FF" stop-opacity="0.75"></stop>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"></stop>
</lineargradient>
<filter height="200%" id="glowUncommon" width="200%" x="-50%" y="-50%">
<fegaussianblur in="SourceGraphic" result="blur" stddeviation="6"></fegaussianblur>
<femerge>
<femergenode in="blur"></femergenode>
<femergenode in="SourceGraphic"></femergenode>
</femerge>
</filter>
</defs>
<style>
    @keyframes uncommonFall {
      0% { transform: translate(-35px, -30px) scale(0.7); opacity: 0; }
      12% { opacity: 1; }
      75% { transform: translate(350px, 260px) scale(1.0); opacity: 1; }
      100% { transform: translate(440px, 330px) scale(0.35); opacity: 0; }
    }
    @keyframes uncommonTrailDash {
      0% { stroke-dashoffset: 320; opacity: 0; }
      15% { opacity: 0.85; }
      80% { stroke-dashoffset: 45; opacity: 0.85; }
      100% { stroke-dashoffset: -50; opacity: 0; }
    }
    @keyframes pulseCoreUncommon {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(90deg) scale(1.15); }
    }
    .uncommon-meteor { animation: uncommonFall 4.0s cubic-bezier(0.3, 0.8, 0.4, 1) infinite; }
    .uncommon-tail { stroke-dasharray: 280; animation: uncommonTrailDash 4.0s cubic-bezier(0.3, 0.8, 0.4, 1) infinite; }
    .uncommon-spin { transform-origin: 0 0; animation: pulseCoreUncommon 3s linear infinite; }
    @keyframes stratumFade { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.45; } }
    .stratum-line { stroke-dasharray: 5 6; animation: stratumFade 3.5s infinite; }
  </style>
<!-- Card Frame -->
<rect fill="#0C1032" height="380" rx="14" stroke="rgba(116, 221, 244, 0.3)" stroke-width="1.2" width="540"></rect>
<rect fill="url(#uncommonNebula)" height="380" rx="14" width="540"></rect>
<!-- Stratosphere Guides (Twilight Zone) -->
<g class="stratum-line" stroke="#74DDF4" stroke-width="1">
<path d="M 30 90 Q 270 120 510 80"></path>
<path d="M 30 200 Q 270 230 510 190" stroke="#60a5fa"></path>
<path d="M 30 310 Q 270 340 510 300"></path>
</g>
<path d="M 40 40 L 480 340" stroke="rgba(116, 221, 244, 0.15)" stroke-dasharray="2 6" stroke-width="1.5"></path>
<!-- Meteor Assembly -->
<g class="uncommon-meteor">
<!-- Tail Plume -->
<path class="uncommon-tail" d="M -150 -115 L 0 0" filter="url(#glowUncommon)" stroke="url(#uncommonTrail)" stroke-linecap="round" stroke-width="4.5"></path>
<path class="uncommon-tail" d="M -90 -70 L 0 0" stroke="#FFFFFF" stroke-linecap="round" stroke-width="2"></path>
<!-- Particle Sparks -->
<circle cx="-35" cy="-27" fill="#74DDF4" filter="url(#glowUncommon)" r="2"></circle>
<circle cx="-65" cy="-50" fill="#60a5fa" r="1.5"></circle>
<circle cx="-100" cy="-77" fill="#B6A4FF" r="1.2"></circle>
<!-- Halo & Corona -->
<circle cx="0" cy="0" fill="#74DDF4" filter="url(#glowUncommon)" opacity="0.3" r="22"></circle>
<circle cx="0" cy="0" fill="#60a5fa" opacity="0.6" r="12"></circle>
<!-- Rotating Star Diamond -->
<g class="uncommon-spin">
<polygon fill="#FFFFFF" filter="url(#glowUncommon)" points="0,-16 4.5,-2 16,0 4.5,2 0,16 -4.5,2 -16,0 -4.5,-2"></polygon>
<polygon fill="#74DDF4" opacity="0.85" points="-8,-8 0,-2 8,-8 2,0 8,8 0,2 -8,8 -2,0"></polygon>
</g>
<circle cx="0" cy="0" fill="#FFFFFF" r="3"></circle>
</g>
<!-- HUD Telemetry -->
<g transform="translate(24, 24)">
<rect fill="#17133B" fill-opacity="0.85" height="48" rx="6" stroke="rgba(116, 221, 244, 0.4)" stroke-width="1" width="180"></rect>
<circle cx="16" cy="18" fill="#74DDF4" r="4"></circle>
<text fill="#74DDF4" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" letter-spacing="1" x="28" y="22">UNCOMMON TIER</text>
<text fill="#B7C0D9" font-family="'JetBrains Mono', monospace" font-size="9" x="14" y="38">FREQ: 25% - 50% // +25m DEPTH</text>
</g>
<g transform="translate(340, 310)">

<text fill="#74DDF4" font-family="'JetBrains Mono', monospace" font-size="9" x="14" y="20">ALTITUDE: -850m</text>
<text fill="#B7C0D9" font-family="'JetBrains Mono', monospace" font-size="8.5" x="14" y="34">ZONE: TWILIGHT STRATUM</text>
</g>
</svg></div><!-- STITCH_SVG_END:ANIMATION_18 -->
</body>
</html>
